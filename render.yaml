services:
  - type: web
    name: facts-studio
    runtime: docker
    plan: free
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PIXABAY_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SESSION_SECRET
        generateValue: true
